<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAC is easy</title>
<style>
:root{--p:#7c5cbf;--p2:#a487e0;--pl:#7c5cbf;--soft:#efe7fb;--bg:#f7f3fd;--card:#fff;--tx:#2b2236;--mut:#7d7390;--line:#e7e0f3;--acc:#e8b44c;--on:#fff;--sh:rgba(80,50,140,.14);--hg:linear-gradient(135deg,#9171d3,#6a4cb4);--dg:#d23b40}
body[data-t=flower]{--p:#d6558a;--p2:#f08db4;--pl:#d6558a;--soft:#fde6ef;--bg:#fff6f9;--line:#f5dce6;--acc:#7cc4a0;--tx:#3a2430;--mut:#9a7686;--sh:rgba(214,85,138,.15);--hg:linear-gradient(135deg,#e56c9f,#c94b82)}
body[data-t=sea]{--p:#1d82c0;--p2:#56b4e6;--pl:#1d82c0;--soft:#dff0fa;--bg:#f2f9fe;--line:#d6e9f5;--acc:#f2b66d;--tx:#17303f;--mut:#6a8798;--sh:rgba(29,130,192,.16);--hg:linear-gradient(135deg,#3f9fda,#1d78b5)}
body[data-t=melon]{--p:#d9414a;--p2:#f27a6e;--pl:#d9414a;--soft:#fde4e2;--bg:#fff6f4;--line:#f6dad6;--acc:#4ca366;--tx:#3b1f1f;--mut:#9b7270;--sh:rgba(217,65,74,.16);--hg:linear-gradient(135deg,#ea5f5a,#c9333d)}
body[data-t=black]{--p:#b79cff;--p2:#7f63d6;--pl:#6a4fd0;--soft:#2a2640;--bg:#15151a;--card:#1f1f27;--tx:#ececf1;--mut:#9b9bab;--line:#2d2d38;--acc:#e8b44c;--on:#17141f;--sh:rgba(0,0,0,.45);--hg:linear-gradient(135deg,#6b53c4,#43348c);--dg:#ff8a8f}
body[data-t=white]{--p:#3b4256;--p2:#6b7691;--pl:#3b4256;--soft:#eceef3;--bg:#f4f5f8;--line:#e3e6ee;--acc:#8d9bbd;--tx:#1d2230;--mut:#6c7488;--sh:rgba(40,50,80,.12);--hg:linear-gradient(135deg,#4d5772,#2f3648)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Segoe UI Variable Text','Segoe UI','Noto Sans Arabic','Cairo','Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;transition:background .3s,color .3s}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--p) 35%,transparent);border-radius:9px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 45%,transparent);outline-offset:2px}
.ic{flex:none}.ltr{direction:ltr;unicode-bidi:isolate}
#app{max-width:1020px;margin:auto;padding:0 22px 96px}
#app>*{animation:vin .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes bn{50%{transform:translateY(-7px);opacity:.4}}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 14px;margin:5px 0 10px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 18%,transparent)}
textarea{min-height:110px;resize:vertical}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;padding:10px 18px;background:var(--soft);color:var(--tx);font-weight:600;transition:transform .15s,box-shadow .2s,background .2s,filter .2s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px var(--sh);filter:brightness(.98)}
button:active{transform:scale(.97);box-shadow:none}
button.pri{background:var(--p);color:var(--on)}
button.del{background:color-mix(in srgb,var(--dg) 12%,var(--card));color:var(--dg)}
button.gh{background:rgba(255,255,255,.18);color:inherit;padding:7px 14px;font-size:14px}
button.sm{padding:7px 12px;font-size:14px;border-radius:11px}
button.big{width:100%;padding:14px;font-size:17px;border-radius:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mut)}.note{display:flex;gap:8px;align-items:center;font-size:14px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 12px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top h1{margin:0;font-size:21px;flex:1;font-weight:800;letter-spacing:.2px}
.top .ib{padding:8px 14px}.ib.round{padding:9px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:12px 0;border:1px solid var(--line);box-shadow:0 2px 14px var(--sh)}
.form input,.form textarea{background:color-mix(in srgb,var(--soft) 45%,var(--card))}
.item .it{flex:1;font-size:17px}.item pre{white-space:pre-wrap;font:inherit;margin:8px 0}
.item img,.prev{max-width:100%;max-height:340px;border-radius:14px;margin-top:8px}
.item{border-inline-start:4px solid var(--p)}
.ai{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 14%,var(--card));color:var(--p);flex:none}
.ai.s{width:40px;height:40px;border-radius:12px}.ai.dg{background:color-mix(in srgb,var(--dg) 14%,var(--card));color:var(--dg)}
.empty{text-align:center;padding:38px 10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty b{color:var(--tx);font-size:17px}
.eb{position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 12%,var(--card));color:var(--p);margin-bottom:6px}
.eb i{position:absolute;top:6px;inset-inline-end:4px;width:14px;height:14px;border-radius:50%;background:var(--acc);opacity:.85}
.hero{position:relative;overflow:hidden;background:var(--hg);color:#fff;border-radius:26px;padding:26px 28px;margin:6px 0 18px;box-shadow:0 14px 34px var(--sh)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero::before{width:220px;height:220px;top:-90px;inset-inline-start:-60px}.hero::after{width:150px;height:150px;bottom:-70px;inset-inline-end:30px;background:color-mix(in srgb,var(--acc) 30%,transparent)}
.hero>*{position:relative}.hero h2{margin:8px 0 4px;font-size:28px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:3px 14px;border-radius:999px;font-size:14px;font-weight:700}
.goal{display:flex;align-items:center;gap:8px;margin:4px 0 16px;font-size:17px;opacity:.95}
.slg2{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.25);padding-top:14px}
.sl-t{font-weight:700;font-size:17px;flex:1;line-height:1.5}.hero .sl-t{color:#fff}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:8px}
.act{flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 14px var(--sh)}
.act .ai{margin-bottom:8px}.act b{font-size:18px}.act small{color:var(--mut);font-weight:500}
.act:hover{transform:translateY(-4px);box-shadow:0 14px 28px var(--sh)}
.act.k1 .ai,.act.k3 .ai,.sub.k1 .sj,.sub.k3 .sj{background:color-mix(in srgb,var(--acc) 22%,var(--card));color:color-mix(in srgb,var(--acc) 72%,var(--tx))}
.sec{margin:22px 4px 10px;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.sub{--m:6%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 12px;border-radius:22px;background:color-mix(in srgb,var(--p) var(--m),var(--card));border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:16px;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 12px var(--sh)}
.sub.k1{--m:9%}.sub.k2{--m:12%}.sub.k3{--m:7%}
.sub:hover{transform:translateY(-5px);box-shadow:0 14px 28px var(--sh)}
.sj{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 16%,var(--card));color:var(--p);font-weight:800;font-size:19px}
.sj.sm{width:40px;height:40px;border-radius:12px;font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.tabs button{white-space:nowrap;border-radius:999px;padding:9px 16px}.tabs button.on{background:var(--p);color:var(--on)}
.rem,.deck{gap:12px}
.flip{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:27px;cursor:pointer;border:2px solid var(--p);border-radius:28px;background:color-mix(in srgb,var(--p) 6%,var(--card));transition:transform .2s}.flip:hover{transform:translateY(-3px)}
.tps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 16px}
.tp{cursor:pointer;text-align:center;font-size:13px;font-weight:700;padding:8px;border-radius:16px;border:2px solid var(--line);background:var(--card);transition:transform .15s,border-color .2s}
.tp:hover{transform:translateY(-2px)}.tp.on{border-color:var(--pl);box-shadow:0 0 0 3px color-mix(in srgb,var(--pl) 20%,transparent)}
.tp i{display:flex;gap:5px;align-items:flex-end;justify-content:center;height:42px;border-radius:10px;padding:6px;margin-bottom:5px;border:1px solid rgba(0,0,0,.08)}
.tp b{width:16px;border-radius:5px}.tp b:first-child{height:100%}.tp b:last-child{height:55%}
.lb{display:flex;align-items:center;gap:6px;font-weight:700;margin:14px 0 4px}
.fl{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;margin:0 0 12px;background:var(--card);color:var(--mut);transition:border-color .2s,box-shadow .2s}
.fl:focus-within{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 18%,transparent);color:var(--p)}
.fl input,.fl select{border:0;margin:0;padding:12px 0;background:transparent;box-shadow:none;color:var(--tx)}
#setup{--p:var(--pl);--card:#fff;--tx:#241d33;--mut:#8a8199;--line:#e6e1ef;--soft:#f1edf8;--on:#fff;max-width:520px;margin:28px auto;background:#fff;color:#241d33;border-radius:28px;padding:30px;box-shadow:0 18px 50px var(--sh);border:1px solid var(--line)}
#setup h3{margin:12px 0 16px;font-size:20px}
.slg{display:flex;align-items:center;gap:14px}.slg .sl-t{color:var(--p)}
#setup .slg{flex-direction:column;text-align:center}
#help{position:fixed;bottom:20px;left:20px;width:48px;height:48px;border-radius:50%;padding:0;background:var(--hg);color:#fff;box-shadow:0 8px 22px var(--sh);z-index:20}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:16px;z-index:40;max-width:90%;box-shadow:0 12px 32px var(--sh);animation:tin .25s;background:var(--card);color:var(--tx);border:1px solid var(--line)}
#toast.ok svg{color:var(--p)}#toast.err{background:color-mix(in srgb,var(--dg) 10%,var(--card));color:var(--dg);border-color:color-mix(in srgb,var(--dg) 35%,var(--line))}
#modal{position:fixed;inset:0;background:rgba(20,14,35,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
#modal>div{background:var(--card);border-radius:24px;padding:24px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .25s}
#modal h3{display:flex;align-items:center;gap:8px;margin-top:0}
.ask{display:flex;gap:14px;align-items:center;margin-bottom:18px}.ask p{margin:0;font-size:17px}
.scene{display:grid;grid-template-columns:minmax(170px,32%) 1fr;gap:20px;align-items:end;direction:ltr;margin:6px 0 12px}
.tcol{text-align:center}.tch{width:100%;max-height:50vh;object-fit:contain;display:block;margin:0 auto 8px}
.tname{display:inline-block;background:var(--card);padding:3px 18px;border-radius:20px;font-weight:700;box-shadow:0 2px 10px var(--sh);border:1px solid var(--line)}
.bcol{display:flex;flex-direction:column;gap:30px;direction:rtl;min-width:0}
.bt{position:relative;background:var(--card);border-radius:28px;padding:14px 22px 18px;filter:drop-shadow(0 4px 12px var(--sh));min-height:190px;animation:pop .35s;border:1px solid var(--line)}
.bt::after{content:'';position:absolute;left:-19px;top:80px;border-style:solid;border-width:14px 20px 14px 0;border-color:transparent var(--card) transparent transparent}
.bp{display:none;align-items:center;gap:10px;justify-content:flex-end;font-size:13px;margin-bottom:4px}.bp button{padding:2px 12px;font-size:13px}
.bc{max-height:44vh;overflow:auto;line-height:1.95;font-size:16px;padding-inline-end:4px}
.bc p{margin:6px 0}.bc h4{margin:12px 0 4px;color:var(--p);font-size:17px}.bc ul,.bc ol{padding-inline-start:24px;margin:6px 0}.bc code{background:var(--soft);padding:1px 6px;border-radius:6px}.bc .src{font-size:13px;color:var(--mut)}
.bs{position:relative;align-self:flex-start;max-width:80%;min-width:150px;background:var(--p);color:var(--on);border-radius:24px;padding:12px 20px;filter:drop-shadow(0 4px 12px var(--sh));animation:pop .35s}
.bs::after{content:'';position:absolute;right:36px;bottom:-15px;border-style:solid;border-width:16px 12px 0 12px;border-color:var(--p) transparent transparent transparent}
.bsi{max-height:18vh;overflow:auto;line-height:1.8}
.dots i{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--p);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.pk{width:130px;text-align:center;cursor:pointer;border:3px solid transparent;border-radius:18px;padding:8px;transition:border-color .2s}.pk.on{border-color:var(--p);background:var(--soft)}.pk img{width:100%;height:150px;object-fit:contain}
@media(max-width:700px){.scene{grid-template-columns:1fr}.tch{max-height:26vh}.bt::after{left:40px;top:-16px;border-width:0 14px 16px 14px;border-color:transparent transparent var(--card) transparent}.hero h2{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Final UI polish: consistent interaction states, comfortable reading and compact screens */
.card,.act,.sub,.tp,.bt,.bs{transition:background-color .22s,border-color .22s,box-shadow .22s,transform .2s}
.card{box-shadow:0 3px 16px var(--sh)}
.card:focus-within{border-color:color-mix(in srgb,var(--p) 42%,var(--line))}
button:focus-visible,.sub:focus-visible,.tp:focus-visible,.flip:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 55%,transparent);outline-offset:3px}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.78}
select{cursor:pointer}
#modal{padding:18px;backdrop-filter:blur(5px)}
#mb{max-height:min(82vh,760px);overflow:auto}
#toast{max-width:min(92vw,520px);box-shadow:0 10px 30px var(--sh)}
.item img,.prev{object-fit:contain;background:color-mix(in srgb,var(--soft) 45%,var(--card))}
@media(max-width:700px){#app{padding-inline:14px}.hero{padding:22px 20px}.act{padding:15px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.sub{padding:18px 10px}.top h1{font-size:19px}.tabs button{padding:8px 13px}}
@media(min-width:1100px){#app{max-width:1080px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Study room, countdown and focus tools */
.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.widget{margin:0;padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 3px 16px var(--sh);min-width:0}
.widget h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.count-number{font-size:34px;font-weight:850;line-height:1.2;color:var(--p);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.count-meta,.widget small{color:var(--mut)}
.focus-time{font-size:36px;font-weight:850;letter-spacing:1px;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;margin:8px 0;color:var(--p)}
.focus-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.focus-controls button{padding:8px 13px}
.focus-select{margin:6px 0 10px;padding:8px 10px}
.statline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.statline:last-child{border:0}.statline b{font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.badge-ach{padding:12px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--p) 5%,var(--card));display:flex;gap:9px;align-items:center;min-width:0}
.badge-ach.locked{opacity:.48;filter:grayscale(.65)}.badge-ach .ai{width:38px;height:38px;border-radius:12px}
.sub-meta{font-size:12px;color:var(--mut);font-weight:500}.sub .continue{font-size:12px;color:var(--p);font-weight:700}
.progress-track{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;width:100%;margin-top:3px}.progress-track i{display:block;height:100%;background:var(--p);border-radius:9px}
@media(max-width:650px){.dashboard{grid-template-columns:1fr}.hero h2{font-size:24px}}
</style>
</head>
<body data-t="grape">
<div id="app"></div>
<button id="help" onclick="helpOpen()" title="مساعدة"></button>
<div id="toast"></div>
<div id="modal" onclick="this.style.display='none'"><div onclick="event.stopPropagation()" id="mb"></div></div>
<script>
const ST={
'علوم تجريبية':['علوم الطبيعة والحياة','العلوم الفيزيائية','اللغة العربية','اللغة الإنجليزية','اللغة الفرنسية','الرياضيات','الفلسفة','التاريخ','الجغرافيا','العلوم الإسلامية'],
'رياضي':['الرياضيات','العلوم الفيزيائية','العلوم الطبيعية','اللغة الإنجليزية','اللغة الفرنسية','العلوم الإسلامية','التاريخ','الجغرافيا','الفلسفة','اللغة العربية'],
'تقني رياضي':['الهندسة المدنية','العلوم الفيزيائية','التاريخ','الجغرافيا','اللغة الإنجليزية','اللغة الفرنسية','اللغة العربية','العلوم الإسلامية','الرياضيات','الفلسفة'],
'تسيير واقتصاد':['المحاسبة','القانون','الرياضيات','اللغة العربية','اللغة الإنجليزية','اللغة الفرنسية','الفلسفة','التاريخ','الجغرافيا'],
'آداب وفلسفة':['اللغة العربية','اللغة الفرنسية','اللغة الإنجليزية','التاريخ','الجغرافيا','الفلسفة','الرياضيات'],
'لغات أجنبية':['اللغة العربية','اللغة الفرنسية','اللغة الإنجليزية','اللغة الألمانية','التاريخ','الجغرافيا','الفلسفة','الرياضيات']};

function daysToBac(){const d=S.user?.bacDate;if(!d)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(d+'T00:00:00');if(Number.isNaN(+b))return null;return Math.ceil((b-a)/86400000)}
function contentTotals(){let out={lessons:0,completedLessons:0,all:0};for(const v of Object.values(S.data||{})){for(const [k,a] of Object.entries(v||{})){if(Array.isArray(a)){out.all+=a.length;if(k==='lessons'){out.lessons+=a.length;out.completedLessons+=a.filter(x=>x.done).length}}}}return out}
function subjectCount(name){const d=S.data[name]||{};return Object.values(d).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
function subjectLessonStats(name){const a=S.data[name]?.lessons||[];return {total:a.length,done:a.filter(x=>x.done).length,last:a[0]?.t||''}}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec||0));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
let focusInterval=null;
function toggleFocus(){const f=S.focus;f.subject=$('#focusSubject')?.value||ST[S.user.stream][0];if(f.running){f.running=false;clearInterval(focusInterval);focusInterval=null;save();home();return}f.running=true;f.startedAt=Date.now();save();startFocusInterval();home()}
function startFocusInterval(){if(focusInterval)return;focusInterval=setInterval(()=>{const f=S.focus;if(!f.running){clearInterval(focusInterval);focusInterval=null;return}f.remaining=Math.max(0,(f.remaining??1500)-1);if(f.remaining%10===0)save();const clock=$('#focusClock');if(clock)clock.textContent=fmtTime(f.remaining);if(f.remaining<=0){f.running=false;f.sessions=(f.sessions||0)+1;f.totalSeconds=(f.totalSeconds||0)+(f.duration||1500);f.subjectSeconds=f.subjectSeconds||{};f.subjectSeconds[f.subject]=(f.subjectSeconds[f.subject]||0)+(f.duration||1500);const day=new Date().toLocaleDateString('en-CA');f.days=f.days||[];if(!f.days.includes(day))f.days.push(day);S.achievements.firstFocus=true;save();clearInterval(focusInterval);focusInterval=null;notify('أحسنت! 🎉','أنهيت جلسة تركيز كاملة. خذ استراحة قصيرة.');if(view==='home')home();}},1000)}
function resetFocus(){const f=S.focus;f.running=false;clearInterval(focusInterval);focusInterval=null;f.duration=1500;f.remaining=1500;save();if(view==='home')home()}
function home(){const u=S.user,L=ST[u.stream],f=S.focus,days=daysToBac(),totals=contentTotals(),subj=Object.entries(f.subjectSeconds||{}).sort((a,b)=>b[1]-a[1]),most=subj[0];
const achievements=[['firstLesson','book','أول درس','أضفت أول درس إلى مكتبتك',totals.lessons>0],['flash10','cards','جامع البطاقات','أنشأت 10 بطاقات حفظ',S.decks.reduce((n,d)=>n+d.cards.length,0)>=10],['firstFocus','target','أول جلسة تركيز','أنهيت أول جلسة بومودورو',f.sessions>0],['streak7','spark','أسبوع من الالتزام','درست 7 أيام مختلفة',new Set(f.days||[]).size>=7],['subjectDone','check','مادة تمت مراجعتها','أكملت مراجعة دروس مادة',totals.completedLessons>0&&totals.completedLessons===totals.lessons],['dailyGoal','spark','هدف اليوم','أنهيت جلسة تركيز اليوم',(f.days||[]).includes(new Date().toLocaleDateString('en-CA'))]];
$('#app').innerHTML=`<div class="top"><img src="${LOGO}" width="38" height="38" alt=""><h1>BAC ${esc(u.year)}</h1><button class="ib round" onclick="settings()" title="الإعدادات">${ic('gear',20)}</button></div>
<section class="hero"><span class="pill">${ic('spark',14)} BAC is easy</span><h2>مرحباً ${esc(u.name)}</h2><p class="goal">${ic('target',20)}<span>${esc(u.goal)}</span></p><div class="slg2"><div class="sl-t">${slogT()}</div><button class="gh" onclick="trg()">${ic('globe',16)} ترجمة</button></div></section>
<div class="dashboard">
<section class="widget"><h3>${ic('cal',19)} العدّ التنازلي للبكالوريا</h3>${days===null?`<div class="count-number">حددي الموعد</div><small>أضيفي تاريخ الامتحان من الإعدادات ليظهر العدّ التنازلي.</small><div style="margin-top:10px"><button class="sm" onclick="settings()">تحديد تاريخ الامتحان</button></div>`:days<0?`<div class="count-number">${Math.abs(days)} يوم</div><small>مرّ على الموعد المحدد للامتحان.</small>`:days===0?`<div class="count-number">اليوم! 🎓</div><small>نتمنى لك التوفيق.</small>`:`<div class="count-number">${days} يوم</div><small>متبقية حتى موعد البكالوريا · ${esc(u.bacDate)}</small>`}</section>
<section class="widget"><h3>${ic('target',19)} ركن التركيز · بومودورو</h3><select id="focusSubject" class="focus-select" aria-label="المادة التي ستدرسها">${L.map(x=>`<option ${f.subject===x?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="focus-time" id="focusClock">${fmtTime(f.remaining??1500)}</div><div class="focus-controls"><button class="pri" id="focusToggle" onclick="toggleFocus()">${f.running?'إيقاف مؤقت':'ابدأ التركيز'}</button><button onclick="resetFocus()">إعادة</button></div><small id="focusHint">جلسة 25 دقيقة · ${f.sessions||0} جلسة مكتملة</small></section>
</div>
<section class="widget" style="margin:14px 0"><h3>${ic('book',19)} غرفتي الدراسية</h3><div class="dashboard" style="margin:8px 0 0;grid-template-columns:repeat(3,minmax(0,1fr))"><div><div class="count-number" style="font-size:25px">${f.sessions||0}</div><small>جلسات تركيز</small></div><div><div class="count-number" style="font-size:25px">${Math.floor((f.totalSeconds||0)/3600)} س</div><small>وقت الدراسة المسجل</small></div><div><div class="count-number" style="font-size:25px">${new Set(f.days||[]).size}</div><small>أيام درست فيها</small></div></div><div class="statline"><span>المادة الأكثر تركيزاً</span><b>${most?esc(most[0]):'ابدأ أول جلسة'}</b></div><div class="statline"><span>الأكثر مراجعةً للدروس</span><b>${Object.entries(S.activity).sort((a,b)=>(b[1]?.reviews||0)-(a[1]?.reviews||0))[0]?.[1]?.reviews?esc(Object.entries(S.activity).sort((a,b)=>(b[1]?.reviews||0)-(a[1]?.reviews||0))[0][0]):'ابدأ بمراجعة درس'}</b></div><div class="statline"><span>الدروس التي تمت مراجعتها</span><b>${totals.completedLessons} / ${totals.lessons}</b></div><div class="statline"><span>المهام / التذكيرات غير المنجزة</span><b>${S.reminders.filter(r=>!r.done).length}</b></div><div class="statline"><span>عناصر دراسية محفوظة</span><b>${totals.all}</b></div><div class="row" style="justify-content:space-between;margin-top:10px"><small class="muted">تحتاج مساعدة في المراجعة؟ الأستاذ الذكي هنا.</small><button class="sm" onclick="go('teacher')">${ic('cap',16)} اسأل الأستاذ</button></div></section>
<section class="widget" style="margin:14px 0"><h3>${ic('spark',19)} إنجازاتي</h3><div class="badges">${achievements.map(a=>`<div class="badge-ach ${a[4]?'':'locked'}"><span class="ai">${ic(a[1],20)}</span><span><b>${a[2]}</b><br><small>${a[3]}</small></span></div>`).join('')}</div></section>
<div class="acts">${[['remind','bell','ذكّرني','مواعيد ومراجعات'],['cards','cards','اقلب وتذكر','بطاقات الحفظ'],['teacher','cap','الأستاذ الذكي','اسأل وتعلّم من دروسك'],['audio','mic','التسجيلات الصوتية','سجّل واستمع']].map((a,i)=>`<button class="act k${i}" onclick="go('${a[0]}')"><span class="ai">${ic(a[1],26)}</span><b>${a[2]}</b><small>${a[3]}</small></button>`).join('')}</div>
<h3 class="sec">مواد شعبة ${esc(u.stream)}</h3><div class="grid">${L.map((x,i)=>{const n=subjectCount(x),active=S.activity[x]?.last||'',ls=subjectLessonStats(x),pct=ls.total?Math.round(ls.done/ls.total*100):0;return `<div class="sub k${i%4}" onclick="openSub(${i})"><span class="sj">${subG(x)}</span><span>${x}</span><span class="sub-meta">${n} عناصر محفوظة · ${ls.done}/${ls.total} دروس مراجَعة${ls.last?' · آخر درس: '+esc(ls.last):''}${active?' · '+esc(active):''}</span><span class="progress-track"><i style="width:${pct}%"></i></span><span class="continue">${n?'متابعة المادة ←':'ابدأ الإضافة ←'}</span></div>`}).join('')}</div>`;
if(f.running&&!focusInterval)startFocusInterval();}
function openSub(i){sub=ST[S.user.stream][i];tab='lessons';go('subject')}
function settings(){const u=S.user;$('#mb').innerHTML=`<h3>${ic('gear',22)} الإعدادات</h3><p class="lb">المظهر</p><div class="tps">${tpHtml(u.theme,"S.user.theme='@';save();render();$('#modal').style.display='none'")}</div><p class="lb">${ic('target',16)} هدفك الدراسي</p><input id="g2" value="${esc(u.goal)}"><p class="lb">${ic('cal',16)} تاريخ امتحان البكالوريا</p><input id="bacDate2" type="date" value="${esc(u.bacDate||'')}"><div class="row"><button class="pri" onclick="S.user.goal=$('#g2').value;S.user.bacDate=$('#bacDate2').value;save();$('#modal').style.display='none';render()">${ic('check',16)} حفظ</button><button class="del" onclick="ask('سيتم حذف كل بياناتك نهائياً. متأكد؟',()=>{localStorage.removeItem('bac');location.reload()})">${ic('trash',16)} حذف كل البيانات</button></div>`;$('#modal').style.display='flex'}
function subject(){
S.data[sub]=S.data[sub]||{};const arr=S.data[sub][tab]=S.data[sub][tab]||[],isImg=tab=='images';
$('#app').innerHTML=bar(sub,'home',`<span class="sj sm">${subG(sub)}</span>`)+`<div class="tabs">${TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';draft={img:null,edit:null};render()">${ic(TI[t[0]],17)}<span>${t[1]}</span></button>`).join('')}</div>

<div class="row"><button onclick="pick(d=>{draft.img=d;$('#imn').textContent='✔ تمت إضافة صورة'})">${ic('image',17)} إضافة صورة</button><span id="imn" class="muted">${draft.img?'✔ تمت إضافة صورة':''}</span><span style="flex:1"></span><button class="pri" onclick="addItem()">${ic(draft.edit!=null?'check':'plus',17)} ${draft.edit!=null?'حفظ التعديل':'إضافة'}</button></div></div>
${arr.length?arr.map((x,i)=>`<div class="card item"><div class="row"><b class="it" style="${tab==='lessons'&&x.done?'text-decoration:line-through;opacity:.65':''}">${esc(x.t)}</b>${tab==='lessons'?`<button class="sm ${x.done?'pri':''}" onclick="toggleLesson(${i})">${ic('check',16)} ${x.done?'تمت المراجعة':'علّمتها كمراجَعة'}</button>`:''}<button class="sm" onclick="editItem(${i})">${ic('pencil',16)} تعديل</button><button class="sm del" onclick="delItem(${i})">${ic('trash',16)} حذف</button></div>${x.b?`<pre>${esc(x.b)}</pre>`:''}${x.i?`<img src="${x.i}">`:''}</div>`).join(''):empty(TI[tab],'لا يوجد شيء هنا بعد','أضف أول عنصر من الأعلى')}`}
function addItem(){const t=$('#ti').value.trim(),b=$('#bo')?$('#bo').value:'';if(!t&&!draft.img)return toast('اكتب عنواناً أو أضف صورة');
const a=S.data[sub][tab],previous=draft.edit!=null?a[draft.edit]:null,o={t:t||'بدون عنوان',b,i:draft.img,done:previous?.done||false};draft.edit!=null?a[draft.edit]=o:a.unshift(o);S.activity[sub]=S.activity[sub]||{};S.activity[sub].last=new Date().toLocaleDateString('ar-DZ');if(tab==='lessons'&&a.length===1)S.achievements.firstLesson=true;save();draft={img:null,edit:null};render()}
function toggleLesson(i){const a=S.data[sub]?.lessons||[],x=a[i];if(!x)return;x.done=!x.done;if(x.done){S.activity[sub]=S.activity[sub]||{};S.activity[sub].reviews=(S.activity[sub].reviews||0)+1;const all=a.length>0&&a.every(v=>v.done);if(all)S.achievements.subjectDone=true;}save();render()}
function editItem(i){const x=S.data[sub][tab][i];draft={img:x.i,edit:i};render();$('#ti').value=x.t;if($('#bo'))$('#bo').value=x.b;scrollTo(0,0)}
function ask(m,fn){$('#mb').innerHTML=`<div class="ask"><span class="ai s dg">${ic('trash',20)}</span><p>${m}</p></div><div class="row" style="justify-content:flex-end"><button id="yes" class="del">${ic('check',16)} نعم، احذف</button><button onclick="$('#modal').style.display='none'">${ic('x',16)} إلغاء</button></div>`;$('#modal').style.display='flex';$('#yes').onclick=()=>{$('#modal').style.display='none';fn()}}

$('#app').innerHTML=bar('ذكّرني','home')+`<div class="card form"><input id="rt" placeholder="ماذا تريد أن تتذكر؟ (مثال: مراجعة الرياضيات)"><input id="rd" type="datetime-local"><button class="pri" onclick="addRem()">${ic('plus',17)} إضافة تذكير</button></div>
<p class="muted note">${ic('bell',15)} يصلك أيضاً تذكير يومي تلقائي الساعة 8 مساءً بتوقيت الجزائر.</p>
${R.length?R.map((r,i)=>`<div class="card row rem"><span class="ai s">${ic(r.done?'check':'bell',20)}</span><b style="flex:1">${esc(r.t)}<br><small class="muted">${esc(r.at.replace('T',' '))}</small></b><button class="sm del" onclick="S.reminders.splice(${i},1);save();render()">${ic('trash',16)} حذف</button></div>`).join(''):empty('bell','لا توجد تذكيرات','حدد موعد مراجعتك القادم')}`}

function cards(){
$('#app').innerHTML=bar('اقلب وتذكر','home')+`<div class="card form"><input id="dn" placeholder="اسم المجموعة (مثال: مصطلحات الفلسفة)"><button class="pri" onclick="addDeck()">${ic('plus',17)} إنشاء مجموعة</button></div>
${S.decks.map((d,i)=>`<div class="card row deck"><span class="ai s">${ic('cards',20)}</span><b style="flex:1">${esc(d.name)} <small class="muted">(${d.cards.length} بطاقة)</small></b><button class="sm" onclick="deck=${i};go('deckv')">${ic('plus',16)} إضافة بطاقات</button><button class="sm pri" onclick="startStudy(${i})">${ic('play',16)} دراسة</button><button class="sm del" onclick="ask('حذف المجموعة بكل بطاقاتها؟',()=>{S.decks.splice(${i},1);save();render()})">${ic('trash',16)}</button></div>`).join('')||empty('cards','لا توجد مجموعات بعد','أنشئ أول مجموعة بطاقات')}`}
function addDeck(){const n=$('#dn').value.trim();if(!n)return;S.decks.push({name:n,cards:[]});save();render()}

<div class="row"><button onclick="pick(x=>{draft.f=x;toast('تمت إضافة صورة للوجه')})">🖼️ صورة للوجه</button><button onclick="pick(x=>{draft.b=x;toast('تمت إضافة صورة للخلف')})">🖼️ صورة للخلف</button><button class="pri" onclick="addCard()">إضافة البطاقة</button></div></div>
${d.cards.map((c,i)=>`<div class="card row"><span style="flex:1">${esc(c.f)} ⟷ ${esc(c.b)} ${c.fi||c.bi?'🖼️':''}</span><button class="del" onclick="S.decks[deck].cards.splice(${i},1);save();render()">حذف</button></div>`).join('')}`}
function addCard(){const f=$('#cf').value.trim(),b=$('#cb').value.trim();if(!(f||draft.f)||!(b||draft.b))return toast('أكمل الوجه والخلف');S.decks[deck].cards.push({f,b,fi:draft.f,bi:draft.b});if(S.decks.reduce((n,d)=>n+d.cards.length,0)>=10)S.achievements.flash10=true;save();draft={img:null,edit:null};render()}
function startStudy(i){deck=i;const n=S.decks[i].cards.length;if(!n)return toast('أضف بطاقات أولاً');order=[...Array(n).keys()];ci=0;flipped=false;go('study')}
function study(){const d=S.decks[deck],c=d.cards[order[ci]],t=flipped?c.b:c.f,im=flipped?c.bi:c.fi;

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bacdb',1);r.onupgradeneeded=()=>r.result.createObjectStore('audio',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});

let rec=null,chunks=[],upBlob=null,recTimer=0;

function audioV(){

<div class="row" style="margin-top:10px"><button class="pri" onclick="saveAudio()">حفظ التسجيل</button></div></div><div id="al"></div>`;loadAudio()}
function toggleRec(){
if(rec&&rec.state=='recording'){rec.stop();return}
navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{chunks=[];rec=new MediaRecorder(st);let n=0;
rec.ondataavailable=e=>chunks.push(e.data);
rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(recTimer);upBlob=new Blob(chunks,{type:rec.mimeType});setT('#rb','⏺️ بدء التسجيل');setT('#as','✔ تم التسجيل، اضغط «حفظ التسجيل»')};
rec.start();setT('#rb','⏹️ إيقاف التسجيل');recTimer=setInterval(()=>setT('#as','🔴 يسجّل... '+(++n)+' ث'),1000)

اكتب بالعربية الواضحة، وكن مشجعاً.`;

A.innerHTML=pend?'<span class="dots"><i></i><i></i><i></i></span>':a?md(a.content):`مرحباً ${esc(S.user.name)}! أنا ${esc(S.teacher.name)}، أستاذك الشخصي. اختر المادة ثم اسألني، وسأشرح لك من دروسك وملخصاتك ومصادرك فقط.`;
A.scrollTop=0;$('#pn').textContent=n>1?(i+1)+' / '+n:'';$('.bp').style.display=n>1?'flex':'none';if(a&&!pend)mathR(A)}

const clean=t=>t.replace(/^.*📚.*$/gm,'').replace(/^[#>\-\s*|]+/gm,'').replace(/[*`_~|#]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\n+/g,'. ').replace(/\s+/g,' ').trim();
function deviceSpeak(text){const sy=window.speechSynthesis;if(!sy)return toast('جهازك لا يدعم القراءة الصوتية');sy.cancel();
const t=clean(text);if(!t)return;
const ar=(t.match(/[\u0600-\u06FF]/g)||[]).length>t.length*.3,lang=ar?'ar':/[éèàçùêâîôû]|\b(le|la|les|des|est|une|et)\b/i.test(t)?'fr-FR':'en-US',vs=sy.getVoices(),v=vs.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
if(!v&&vs.length)toast(ar?'لا يوجد صوت عربي في جهازك. ثبّت حزمة الصوت العربي من إعدادات النظام (الوقت واللغة ← الكلام).':'لا يوجد صوت لهذه اللغة في جهازك.');
const parts=[];t.split(/(?<=[.!؟?،:؛])\s+/).forEach(x=>{while(x.length>180){let i=x.lastIndexOf(' ',180);if(i<1)i=180;parts.push(x.slice(0,i));x=x.slice(i)}if(x.trim())parts.push(x)});
parts.forEach(c=>{const u=new SpeechSynthesisUtterance(c);u.lang=lang;if(v)u.voice=v;u.rate=S.tts?.rate||1;sy.speak(u)})}
const SITES=[['ChatGPT','https://chatgpt.com'],['Gemini','https://gemini.google.com'],['Claude','https://claude.ai']];
function aiweb(){const el=navigator.userAgent.includes('Electron'),a=S.web||{url:SITES[0][1]},L=ST[S.user.stream];
$('#app').innerHTML=bar('🧑‍🏫 الأستاذ الذكي','home')+`<div class="card"><div class="row">${SITES.map(x=>`<button class="${a.url==x[1]?'pri':''}" onclick="S.web={url:'${x[1]}'};save();aiweb()">${x[0]}</button>`).join('')}<input id="wu" dir="ltr" style="width:230px;margin:0" placeholder="موقع آخر: https://..." value="${SITES.some(x=>x[1]==a.url)?'':esc(a.url)}"><button onclick="let u=$('#wu').value.trim();if(u.startsWith('https://')){S.web={url:u};save();aiweb()}else toast('اكتب رابطاً يبدأ بـ https://')">فتح</button></div>
<div class="row" style="margin-top:10px"><select style="width:auto;margin:0" onchange="T.sub=this.selectedIndex">${L.map((x,i)=>`<option ${i==T.sub?'selected':''}>${x}</option>`).join('')}</select><button class="pri" onclick="copyKit()">📋 انسخ تعليمات الأستاذ ومصادر المادة</button><button onclick="go('teacher')">العودة إلى أستاذي بالشخصية</button></div>
<p class="muted">سجّل دخولك بحسابك في الموقع (يبقى الدخول محفوظاً). لتجعل الأستاذ يشرح من دروسك: اضغط «انسخ»، ثم الصق (Ctrl+V) في المحادثة وأرسل. وللتحدث صوتياً استعمل زر الصوت داخل الموقع نفسه.</p></div>
${el?`<webview src="${esc(a.url)}" partition="persist:ai" allowpopups style="width:100%;height:68vh;border-radius:12px"></webview>`:`<div class="card">هذه الميزة تعمل في نسخة سطح المكتب فقط (npm start). في المتصفح يمكنك <a href="${esc(a.url)}" target="_blank">فتح الموقع</a> في نافذة منفصلة.</div>`}`}
function copyKit(){const c=sources(),tx=c.filter(x=>x.type=='text').map(x=>x.text).join('\n\n'),skip=c.length-c.filter(x=>x.type=='text').length;
if(!tx.trim())return toast('لا توجد نصوص محفوظة في هذه المادة. أضف دروساً أولاً');
navigator.clipboard.writeText(SYS+'\n\n===مصادري المعتمدة الوحيدة===\n\n'+tx+'\n\n===نهاية المصادر===\nابدأ بسؤالي عما أريد دراسته.').then(()=>toast('تم النسخ. الصقه في المحادثة وأرسله.'+(skip?' (الصور والملفات لا تُنسخ، ارفقها داخل الموقع)':''))).catch(()=>toast('تعذر النسخ'))}
let aud=null,vq=0;
function stopVoice(){vq++;try{speechSynthesis.cancel()}catch(e){}if(aud){aud.pause();aud=null}}
const splitT=(t,n)=>{const o=[];let c='';t.split(/(?<=[.!؟?])\s+/).forEach(x=>{if((c+' '+x).length>n&&c){o.push(c);c=''}c+=(c?' ':'')+x;while(c.length>n){o.push(c.slice(0,n));c=c.slice(n)}});if(c)o.push(c);return o};
function wav(b64){const pcm=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),h=new DataView(new ArrayBuffer(44)),w=(o,s)=>[...s].forEach((c,i)=>h.setUint8(o+i,c.charCodeAt(0)));
w(0,'RIFF');h.setUint32(4,36+pcm.length,true);w(8,'WAVEfmt ');h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);h.setUint32(24,24000,true);h.setUint32(28,48000,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,'data');h.setUint32(40,pcm.length,true);return new Blob([h,pcm],{type:'audio/wav'})}
async function aiAudio(t,a,p){const tm=a.tm||PROV[p].tm,tv=a.tv||PROV[p].tv;
if(p=='gemini'){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${tm}:generateContent?key=${encodeURIComponent(a.key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:t}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:tv}}}}})});
const d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);const b=(d.candidates?.[0]?.content?.parts||[]).find(x=>x.inlineData)?.inlineData;if(!b)throw new Error('لم يصل صوت من الخدمة');return URL.createObjectURL(wav(b.data))}
if(p=='custom'&&!a.url)throw new Error('أدخل عنوان الخدمة');
const r=await fetch((p=='custom'?a.url.replace(/\/+$/,''):'https://api.openai.com/v1')+'/audio/speech',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+a.key},body:JSON.stringify({model:tm,voice:tv,input:t,response_format:'mp3'})});
if(!r.ok){let m=r.status;try{m=(await r.json()).error?.message||m}catch(e){}throw new Error(m)}return URL.createObjectURL(await r.blob())}
async function speak(text){const t=clean(text);if(!t)return;stopVoice();const my=vq,a=S.ai||{},p=prov(a);
if(!a.key||p=='anthropic'){if(p=='anthropic')toast('Claude لا يوفر واجهة صوت. اختر Gemini أو OpenAI ليتحدث الأستاذ بصوت الذكاء الاصطناعي. سأقرأ الآن بصوت الجهاز.');return deviceSpeak(text)}
const parts=splitT(t,1200);toast('⏳ يجهّز الأستاذ صوته...');
try{let next=aiAudio(parts[0],a,p);for(let i=0;i<parts.length;i++){const url=await next;if(my!=vq)return;if(i+1<parts.length)next=aiAudio(parts[i+1],a,p);next.catch(()=>{});
await new Promise(res=>{aud=new Audio(url);aud.playbackRate=S.tts?.rate||1;aud.onended=res;aud.onerror=res;aud.play().catch(res)});if(my!=vq)return}}
catch(e){if(my==vq){toast('تعذر صوت الذكاء الاصطناعي: '+e.message+' — سأقرأ بصوت الجهاز');deviceSpeak(text)}}}
async function testVoice(){const a={provider:$('#ap').value,key:$('#ak').value.trim(),url:$('#au').value.trim(),tm:$('#atm').value.trim(),tv:$('#atv').value.trim()},p=a.provider,o=$('#vt');
if(p=='anthropic'){o.textContent='Claude لا يوفر صوتاً. اختر Gemini أو OpenAI.';return}
if(!a.key){o.textContent='أدخل المفتاح أولاً';return}
o.textContent='⏳ جارٍ التجربة...';stopVoice();
try{const u=await aiAudio('مرحباً، أنا أستاذك الشخصي. هذا صوت الذكاء الاصطناعي.',a,p);o.textContent='✔ نجح الاتصال، يجب أن تسمع الصوت الآن';aud=new Audio(u);aud.play()}catch(e){o.textContent='✖ فشل: '+e.message}}
function attach(){const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='.pdf,image/*,.txt,.md';i.onchange=()=>{[...i.files].forEach(f=>{if(f.size>15e6)return toast('الملف '+f.name+' كبير جداً');const r=new FileReader(),txt=/\.(txt|md)$/i.test(f.name);r.onload=()=>{T.files.push({name:f.name,type:f.type,txt,data:txt?r.result:r.result.split(',')[1]});setT('#tf',T.files.map(x=>x.name).join('، '))};txt?r.readAsText(f):r.readAsDataURL(f)})};i.click()}
function sources(){const nm=ST[S.user.stream][T.sub],sb=S.data[nm]||{},c=[];let n=0;
const lab={lessons:'دروس',summaries:'ملخصات',exercises:'تمارين',notes:'ملاحظات',solutions:'حلول التمارين',images:'صور المادة'};
for(const k in lab)(sb[k]||[]).forEach(x=>{const h=`[المصدر: ${nm} / ${lab[k]} / ${x.t}]`;
if(x.b||!x.i)c.push({type:'text',text:h+'\n'+(x.b||'')});
if(x.i&&n<10){n++;c.push({type:'text',text:h+' (صورة):'},{type:'image',source:{type:'base64',media_type:'image/jpeg',data:x.i.split(',')[1]}})}});
T.files.forEach(f=>{if(f.txt)c.push({type:'text',text:`[المصدر: ملف ${f.name}]\n`+f.data});
else if(/pdf/i.test(f.type))c.push({type:'document',title:f.name,source:{type:'base64',media_type:'application/pdf',data:f.data}});
else if(f.type.startsWith('image/'))c.push({type:'text',text:`[المصدر: صورة ${f.name}]`},{type:'image',source:{type:'base64',media_type:f.type,data:f.data}})});
return c}
const PROV={gemini:{m:'gemini-2.5-flash',tm:'gemini-3.1-flash-tts-preview',tv:'Kore'},openai:{m:'gpt-5-mini',tm:'gpt-4o-mini-tts',tv:'alloy'},anthropic:{m:'claude-sonnet-5-5',tm:'',tv:''},custom:{m:'',tm:'tts-1',tv:'alloy'}};
const prov=a=>a.provider||(a.key?'anthropic':'gemini');
async function api(sys,messages){const a=S.ai||{},p=prov(a),m=a.model||PROV[p].m,H={'content-type':'application/json'},arr=x=>Array.isArray(x)?x:[x];let r,d;
if(p=='gemini'){const pt=b=>typeof b=='string'?{text:b}:b.type=='text'?{text:b.text}:{inlineData:{mimeType:b.type=='image'?b.source.media_type:'application/pdf',data:b.source.data}};
r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(a.key)}`,{method:'POST',headers:H,body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:messages.map(x=>({role:x.role=='user'?'user':'model',parts:arr(x.content).map(pt)})),generationConfig:{maxOutputTokens:4000}})});
d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('')||'(لم يصل رد)'}
if(p=='openai'||p=='custom'){const pt=b=>typeof b=='string'?{type:'text',text:b}:b.type=='text'?{type:'text',text:b.text}:b.type=='image'?{type:'image_url',image_url:{url:`data:${b.source.media_type};base64,${b.source.data}`}}:{type:'file',file:{filename:(b.title||'file')+'.pdf',file_data:`data:application/pdf;base64,${b.source.data}`}};
if(p=='custom'&&(!a.url||!m))throw new Error('أدخل عنوان الخدمة واسم النموذج في الإعدادات');
r=await fetch((p=='custom'?a.url.replace(/\/+$/,''):'https://api.openai.com/v1')+'/chat/completions',{method:'POST',headers:{...H,authorization:'Bearer '+a.key},body:JSON.stringify({model:m,messages:[{role:'system',content:sys},...messages.map(x=>({role:x.role,content:arr(x.content).map(pt)}))]})});
d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.choices[0].message.content}
r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{...H,'x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:4000,system:sys,messages})});
d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.content.map(x=>x.text||'').join('')}
async function send(){const q=$('#tq').value.trim();if(!q||T.busy)return;
if(!S.ai?.key){tset();toast('أدخل مفتاح API أولاً');return}
const src=sources();if(!src.length){toast('لا توجد مصادر في هذه المادة. احفظ دروساً أو ألحق ملفاً أولاً');return}
T.msgs.push({role:'user',content:q});T.vi=-1;T.busy=true;$('#tq').value='';paint();
const exam=T.mode=='exam';T.mode='';
try{const base=[{role:'user',content:[...src,{type:'text',text:'هذه مصادري المعتمدة الوحيدة. لا تعتمد على غيرها.'}]},{role:'assistant',content:'استلمتُ المصادر وسألتزم بها حصراً. بماذا أبدأ؟'}];
const sys=SYS+(T.key?'\n\nمفتاح تصحيح آخر اختبار (سري، لا تعرضه قبل أن يجيب الطالب):\n'+T.key:'');
let r=await api(sys,[...base,...T.msgs.map(m=>({role:m.role,content:m.content}))]);
if(exam&&r.includes('===مفتاح التصحيح==='))r=await api(VER,[{role:'user',content:[...src,{type:'text',text:'الاختبار المقترح:\n'+r}]}]);
const p=r.split('===مفتاح التصحيح===');if(p[1]){T.key=p[1].trim();r=p[0].trim()+'\n\n(أجب عن الأسئلة وأرسل إجاباتك لأصحّحها وفق مصادرك.)'}
T.msgs.push({role:'assistant',content:r});if(S.tts?.auto)speak(r)}catch(e){T.msgs.push({role:'assistant',content:'⚠️ تعذر الاتصال: '+e.message})}
T.busy=false;paint()}

function tick(){if(!S.user)return;
const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Algiers',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit'}).formatToParts(new Date()),g=k=>p.find(x=>x.type==k).value,day=g('year')+'-'+g('month')+'-'+g('day');
if(+g('hour')%24>=20&&S.last!=day){S.last=day;save();notify('📚 وقت المراجعة، '+S.user.name,'هدفك: '+S.user.goal)}
let ch=false;S.reminders.forEach(r=>{if(!r.done&&new Date(r.at)<=new Date()){r.done=true;ch=true;notify('⏰ تذكير',r.t)}});
if(ch){save();if(view=='remind')render()}}
if(S.user)askPerm();
if(S.focus?.running){S.focus.running=false;save()}
$('#help').innerHTML=ic('help',24);
render();tick();setInterval(tick,20000);
